services:
  web:
    image: oven/bun:1.2-debian
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
      - /run/base44/app.env
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - NODE_ENV=production
      - NITRO_PRESET=node-server
      - PORT=3000
      - HOST=0.0.0.0
    command: sh -c "bun install && bun run build && node .output/server/index.mjs"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 120s
